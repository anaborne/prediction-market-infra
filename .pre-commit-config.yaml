repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Must track [project.dependencies] and the dev group in pyproject.toml.
        # The hook runs in its own isolated venv, so anything missing here shows up
        # as a spurious import-not-found instead of as a real type error.
        additional_dependencies:
          [
            aiohttp,
            websockets,
            cryptography,
            orjson,
            uvloop,
            python-dotenv,
            prefect,
            pytest,
            pytest-asyncio,
          ]
        args: [--strict]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
